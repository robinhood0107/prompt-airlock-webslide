<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prompt Airlock의 월별 개발 진행상황과 발표 슬라이드.">
  <title>Prompt Airlock · 프로젝트 진행보고</title>
  <link rel="icon" href="./assets/airlock.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #0b1019; --surface: #111b29; --text: #f0f4fa; --muted: #a1afc2; --line: #263548; --accent: #69d4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 900px; margin: auto; padding: clamp(32px, 9vw, 100px) 24px; }
    h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 600; letter-spacing: -.04em; margin: 0 0 16px; }
    p { color: var(--muted); line-height: 1.6; }
    .archive { list-style: none; padding: 0; margin: 56px 0 0; }
    a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); text-decoration: none; line-height: 1.5; }
    a:hover { border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .arrow { color: var(--accent); font-size: 24px; }
    @media (max-width: 480px) { a { padding: 22px; gap: 12px; } }
  </style>
</head>
<body>
  <main>
    <h1>Prompt Airlock · 프로젝트 진행보고</h1>
    <p>월별 개발 진행상황과 발표 슬라이드.</p>
    <ul class="archive" aria-label="월별 발표자료">
      <!-- 월별 디렉터리를 추가할 때 이 목록에 새 항목을 추가합니다. -->
      <li><a href="./2026-10/"><span>2026.10 — 9월 진행상황 및 10월 계획</span><span class="arrow" aria-hidden="true">↗</span></a></li>
    </ul>
  </main>
</body>
</html>
